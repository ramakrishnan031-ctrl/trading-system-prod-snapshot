# /etc/ssh/sshd_config.d/99-trading-security.conf
# Trading System — SSH hardening (Phase 1, 2026-06-19). Deploy with:
#   sudo cp deploy/security/sshd_config.d/99-trading-security.conf /etc/ssh/sshd_config.d/
#   sudo sshd -t && sudo systemctl reload ssh
#
# #2 ONLY (Rama's decision): disable root login entirely. No root keys exist and
# `ubuntu` is the only login user, so this is zero-risk and only stops the
# constant root brute-force probes from reaching auth at all.
#
# Deliberately NOT set (Rama):
#   - ClientAliveInterval (idle timeout) — operator runs long `tail -f` sessions.
#   - MaxSessions — left at 10 (VS Code Claude multiplexes).
PermitRootLogin no
