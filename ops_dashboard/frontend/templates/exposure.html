{% extends "base.html" %}
{% block title %}Exposure{% endblock %}
{% block nav_exposure %}active{% endblock %}
{% block content %}
<div x-data="pageBase('/api/exposure')" x-init="load()" @ops-refresh.window="load()">
  <section class="panel">
    <h2 class="panel-title">Exposure <span class="panel-sub" x-text="data.today || ''"></span></h2>
    <div class="big-grid">
      <div class="bignum"><span class="bn-label">Gross Exposure</span><span class="bn-val" x-text="money(data.gross_exposure)"></span></div>
      <div class="bignum"><span class="bn-label">Margin Used</span><span class="bn-val" x-text="money(data.margin_used)"></span><span class="bn-sub" x-text="data.margin_vs_capital_pct != null ? (data.margin_vs_capital_pct + '% of capital') : ''"></span></div>
    </div>
    <div class="two-col" style="margin-top:14px">
      <div>
        <h2 class="panel-title">Per strategy</h2>
        <table class="cap-table"><thead><tr><th>Strategy</th><th>Value</th><th>Margin</th><th>Pos</th></tr></thead><tbody>
          <template x-for="r in data.per_strategy || []" :key="r.strategy">
            <tr><td x-text="r.strategy"></td><td class="cap-num" x-text="money(r.value)"></td><td class="cap-num" x-text="money(r.margin)"></td><td class="cap-num" x-text="r.positions"></td></tr>
          </template>
          <tr x-show="!data.per_strategy || data.per_strategy.length === 0" x-cloak><td colspan="4" class="ev-empty">No open exposure.</td></tr>
        </tbody></table>
      </div>
      <div>
        <h2 class="panel-title">Per symbol (top-N concentration)</h2>
        <template x-for="r in data.per_symbol || []" :key="r.symbol">
          <div class="hbar-row">
            <span class="hbar-label" x-text="r.symbol"></span>
            <span class="hbar"><span class="hbar-fill" :style="'width:' + Math.min(100, 100*r.value/(data.gross_exposure||1)) + '%'"></span></span>
            <span class="hbar-val" x-text="money(r.value)"></span>
          </div>
        </template>
        <span x-show="!data.per_symbol || data.per_symbol.length === 0" x-cloak class="ev-empty">No open exposure.</span>
      </div>
    </div>
  </section>
</div>
{% endblock %}
