<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlgoCore Systems — Login</title>
  <!-- Self-contained: static assets require auth (see backend/app.py _LOGIN_EXEMPT),
       so the login page inlines its CSS and hero art (base64 WebP, no external request).
       Production hero asset (committed): assets/illustrations/login/login-chip-eagle.web.webp
       — its bytes are base64-inlined below; mix-blend-mode:lighten drops the matte-black bg
       over the panel gradient. Editable master PNG is LOCAL-ONLY (git-ignored, never shipped). -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070c;
      --panel: #12161f;
      --panel-border: #262c3a;
      --text: #e6edf3;
      --muted: #8b949e;
      --dim: #6e7681;
      --accent: #58a6ff;
      --accent-glow: #3ba7ff;
      --green: #238636;
      --green-hover: #2ea043;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      font-family: Inter, "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .login-page {
      display: flex; width: 100%; min-height: 100vh;
    }

    /* ── Left: hero pane (40-45%), matte charcoal + faint PCB grid, no animation ── */
    /* ⭐ THE CHIP HUGS THE SPLIT LINE instead of centring in its own pane.
       Each pane was centring its own content, so the hero's slack (188px) and the
       card's slack (336px) met in the middle and became ONE 548px void at 1920 --
       the band Rama boxed in red. Biasing both panes inward closes it.
       ⛔ The 42% pane, its background, its overflow:hidden and the chip's own
       min(64%, 420px) size are ALL unchanged. */
    .login-hero {
      flex: 0 0 42%;
      position: relative;
      display: flex; align-items: center; justify-content: flex-end;
      background:
        radial-gradient(ellipse at center, #0a0e16 0%, #05070c 70%),
        repeating-linear-gradient(0deg, rgba(88,166,255,.035) 0px, rgba(88,166,255,.035) 1px, transparent 1px, transparent 32px),
        repeating-linear-gradient(90deg, rgba(88,166,255,.035) 0px, rgba(88,166,255,.035) 1px, transparent 1px, transparent 32px);
      overflow: hidden;
      isolation: isolate;
    }
    /* ⛔ THE OFFSET IS A MARGIN ON THE IMAGE, ⛔ NOT PADDING ON THE PANE.
       Padding shrinks the pane's CONTENT BOX, and the chip's width is a
       PERCENTAGE of that box -- so the first attempt silently shrank the chip on
       narrower screens (380.6px -> 335px at 1440, 316px -> 278px at 1200) while
       leaving 1920 untouched, because the 420px cap was binding there and hid it.
       A margin moves the chip without touching the box it measures itself
       against, so min(64%, 420px) resolves exactly as it always did. */
    .login-hero img {
      width: min(64%, 420px); height: auto; mix-blend-mode: lighten;
      margin-right: clamp(32px, 8vw, 160px);
    }

    /* ── Right: card pane (55-60%) ── */
    .login-card-wrap {
      flex: 1 1 58%;
      display: flex; align-items: center; justify-content: flex-start;
      padding: 24px;
      padding-left: clamp(32px, 5vw, 100px);
    }
    .card {
      width: 100%; max-width: 380px;
      background: rgba(22, 27, 34, .72);
      backdrop-filter: blur(6px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 32px 30px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
    h1 .brand-accent { color: var(--accent); }
    h1 .brand-rest { color: var(--text); }
    .sub { color: var(--muted); font-size: .82rem; margin: 0 0 22px; }
    label { display: block; font-size: .78rem; font-weight: 500; color: var(--muted); margin: 14px 0 5px; }
    input {
      width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid var(--panel-border);
      border-radius: 6px; color: var(--text); font-size: .92rem; font-family: inherit;
    }
    input::placeholder { color: #4b5560; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.15); }
    button {
      width: 100%; margin-top: 22px; padding: 11px; background: var(--green); border: 0;
      border-radius: 6px; color: #fff; font-weight: 600; font-size: .95rem; cursor: pointer;
    }
    button:hover { background: var(--green-hover); }
    .err {
      margin-top: 14px; padding: 9px 11px; background: #3d1418; border: 1px solid #6e2530;
      border-radius: 6px; color: #ffb4bb; font-size: .82rem;
    }
    .foot {
      margin-top: 20px; color: var(--dim); font-size: .72rem; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .foot svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* ── Mobile: hide hero, card only, centered ── */
    @media (max-width: 780px) {
      .login-hero { display: none; }
      /* ⛔ With the hero gone there is no split line to hug, so the card returns
         to dead centre -- otherwise the inward bias above would pin it left. */
      .login-card-wrap { flex: 1 1 100%; justify-content: center; padding-left: 24px; }
    }
  </style>
</head>
