<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlgoCore Systems — Login</title>
  <!-- Self-contained: static assets require auth (see backend/app.py _LOGIN_EXEMPT),
       so the login page inlines its CSS and hero art (inline SVG, no external request). -->
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070c;
      --panel: #12161f;
      --panel-border: #262c3a;
      --text: #e6edf3;
      --muted: #8b949e;
      --dim: #6e7681;
      --accent: #58a6ff;
      --accent-glow: #3ba7ff;
      --green: #238636;
      --green-hover: #2ea043;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      font-family: Inter, "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    .login-page {
      display: flex; width: 100%; min-height: 100vh;
    }

    /* ── Left: hero pane (40-45%), matte charcoal + faint PCB grid, no animation ── */
    .login-hero {
      flex: 0 0 42%;
      position: relative;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at center, #0a0e16 0%, #05070c 70%),
        repeating-linear-gradient(0deg, rgba(88,166,255,.035) 0px, rgba(88,166,255,.035) 1px, transparent 1px, transparent 32px),
        repeating-linear-gradient(90deg, rgba(88,166,255,.035) 0px, rgba(88,166,255,.035) 1px, transparent 1px, transparent 32px);
      overflow: hidden;
    }
    .login-hero svg { width: min(60%, 340px); height: auto; filter: drop-shadow(0 0 18px rgba(59,167,255,.25)); }

    /* ── Right: card pane (55-60%) ── */
    .login-card-wrap {
      flex: 1 1 58%;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 380px;
      background: rgba(22, 27, 34, .72);
      backdrop-filter: blur(6px);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 32px 30px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5);
    }
    h1 { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
    h1 .brand-accent { color: var(--accent); }
    h1 .brand-rest { color: var(--text); }
    .sub { color: var(--muted); font-size: .82rem; margin: 0 0 22px; }
    label { display: block; font-size: .78rem; font-weight: 500; color: var(--muted); margin: 14px 0 5px; }
    input {
      width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid var(--panel-border);
      border-radius: 6px; color: var(--text); font-size: .92rem; font-family: inherit;
    }
    input::placeholder { color: #4b5560; }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.15); }
    button {
      width: 100%; margin-top: 22px; padding: 11px; background: var(--green); border: 0;
      border-radius: 6px; color: #fff; font-weight: 600; font-size: .95rem; cursor: pointer;
    }
    button:hover { background: var(--green-hover); }
    .err {
      margin-top: 14px; padding: 9px 11px; background: #3d1418; border: 1px solid #6e2530;
      border-radius: 6px; color: #ffb4bb; font-size: .82rem;
    }
    .foot {
      margin-top: 20px; color: var(--dim); font-size: .72rem; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .foot svg { width: 13px; height: 13px; flex-shrink: 0; }

    /* ── Mobile: hide hero, card only, centered ── */
    @media (max-width: 780px) {
      .login-hero { display: none; }
      .login-card-wrap { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-hero" aria-hidden="true">
      <svg viewBox="0 0 240 240">
        <defs>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- pins: top -->
        <g stroke="#3ba7ff" stroke-width="2.5" filter="url(#glow)">
          <line x1="72" y1="46" x2="72" y2="24"/>
          <line x1="86" y1="46" x2="86" y2="20"/>
          <line x1="100" y1="46" x2="100" y2="16"/>
          <line x1="114" y1="46" x2="114" y2="14"/>
          <line x1="128" y1="46" x2="128" y2="14"/>
          <line x1="142" y1="46" x2="142" y2="16"/>
          <line x1="156" y1="46" x2="156" y2="20"/>
          <line x1="170" y1="46" x2="170" y2="24"/>
          <!-- pins: bottom (mirrored) -->
          <line x1="72" y1="194" x2="72" y2="216"/>
          <line x1="86" y1="194" x2="86" y2="220"/>
          <line x1="100" y1="194" x2="100" y2="224"/>
          <line x1="114" y1="194" x2="114" y2="226"/>
          <line x1="128" y1="194" x2="128" y2="226"/>
          <line x1="142" y1="194" x2="142" y2="224"/>
          <line x1="156" y1="194" x2="156" y2="220"/>
          <line x1="170" y1="194" x2="170" y2="216"/>
          <!-- pins: left -->
          <line x1="46" y1="72" x2="24" y2="72"/>
          <line x1="46" y1="86" x2="20" y2="86"/>
          <line x1="46" y1="100" x2="16" y2="100"/>
          <line x1="46" y1="114" x2="14" y2="114"/>
          <line x1="46" y1="128" x2="14" y2="128"/>
          <line x1="46" y1="142" x2="16" y2="142"/>
          <line x1="46" y1="156" x2="20" y2="156"/>
          <line x1="46" y1="170" x2="24" y2="170"/>
          <!-- pins: right (mirrored) -->
          <line x1="194" y1="72" x2="216" y2="72"/>
          <line x1="194" y1="86" x2="220" y2="86"/>
          <line x1="194" y1="100" x2="224" y2="100"/>
          <line x1="194" y1="114" x2="226" y2="114"/>
          <line x1="194" y1="128" x2="226" y2="128"/>
          <line x1="194" y1="142" x2="224" y2="142"/>
          <line x1="194" y1="156" x2="220" y2="156"/>
          <line x1="194" y1="170" x2="216" y2="170"/>
        </g>

        <!-- chip body: rounded-square smoked glass, neon edge -->
        <rect x="46" y="46" width="148" height="148" rx="22"
              fill="rgba(20,40,60,.18)" stroke="#3ba7ff" stroke-width="2.5" filter="url(#glow)"/>
        <rect x="58" y="58" width="124" height="124" rx="14"
              fill="none" stroke="rgba(88,166,255,.35)" stroke-width="1"/>

        <!-- faint internal PCB traces -->
        <g stroke="rgba(88,166,255,.28)" stroke-width="1" fill="none">
          <path d="M58 90 h20 v-12"/>
          <path d="M182 150 h-18 v14"/>
          <path d="M90 182 v-18 h14"/>
          <path d="M150 58 v16 h16"/>
        </g>

        <!-- center emblem: heraldic eagle, engraved linework -->
        <g transform="translate(120,120)" fill="none" stroke="#7fc4ff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
          <!-- wings -->
          <path d="M0,-6 C-14,-14 -30,-10 -44,-2 C-36,2 -30,2 -24,-1 C-30,6 -38,9 -46,9
                    C-36,15 -24,15 -16,10 C-20,17 -27,21 -35,22
                    C-24,26 -12,23 -4,15 C-2,10 -1,3 0,-6 Z"/>
          <path d="M0,-6 C14,-14 30,-10 44,-2 C36,2 30,2 24,-1 C30,6 38,9 46,9
                    C36,15 24,15 16,10 C20,17 27,21 35,22
                    C24,26 12,23 4,15 C2,10 1,3 0,-6 Z"/>
          <!-- head -->
          <circle cx="0" cy="-16" r="7"/>
          <path d="M-4,-16 L-12,-14 L-4,-12 Z" fill="#7fc4ff" stroke="none"/>
          <!-- shield / chest -->
          <path d="M-10,-4 L10,-4 L10,14 C10,22 4,28 0,30 C-4,28 -10,22 -10,14 Z"/>
          <line x1="0" y1="-4" x2="0" y2="26"/>
          <line x1="-10" y1="6" x2="10" y2="6"/>
          <!-- talons / laurel hint -->
          <path d="M-6,30 L-12,38 M6,30 L12,38"/>
        </g>
      </svg>
    </div>

    <div class="login-card-wrap">
      <form class="card" method="post" action="/login" autocomplete="off">
        <h1><span class="brand-accent">AlgoCore</span> <span class="brand-rest">Systems</span></h1>
        <p class="sub">Operations Control Tower · Secure Read-Only Access</p>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
        <label for="username">Username</label>
        <input id="username" name="username" type="text" placeholder="Enter your username" autofocus required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required>
        <label for="totp">Authenticator code</label>
        <input id="totp" name="totp" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="6-digit TOTP">
        <button type="submit">Sign In</button>
        <div class="foot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2 L20 5 V11 C20 16 16.5 20.5 12 22 C7.5 20.5 4 16 4 11 V5 Z"/>
          </svg>
          Read Only · TOTP Protected
        </div>
      </form>
    </div>
  </div>
</body>
</html>
