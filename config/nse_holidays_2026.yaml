# NSE Trading Holidays 2026
# Source: NSE Circular NSE/CMTR/71775 dated 12-Dec-2025
# Capital Market Segment
#
# Note: Muhurat Trading on 08-Nov-2026 (Sunday, Diwali Laxmi Pujan)
# Timings to be notified by NSE separately.
# System treats this as holiday by default. Operator can override
# if Muhurat session participation is desired.
#
# Holidays falling on Saturday/Sunday are NOT listed below
# (weekends are already non-trading days):
#   15-Feb-2026 (Sun) Mahashivratri
#   21-Mar-2026 (Sat) Id-Ul-Fitr
#   15-Aug-2026 (Sat) Independence Day
#   08-Nov-2026 (Sun) Diwali Laxmi Pujan (Muhurat Trading)

