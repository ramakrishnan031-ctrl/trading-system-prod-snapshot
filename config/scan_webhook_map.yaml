    chartink_url: "https://chartink.com/screener/first-pullback-short"

  vwap_rejection_short:
    strategy: vwap_rejection_short
    chartink_url: "https://chartink.com/screener/vwap-rejection-short"

  gap_go_short:
    strategy: gap_go_short
    chartink_url: "https://chartink.com/screener/gap-go-short"

  gap_fade_short:
    strategy: gap_fade_short
    chartink_url: "https://chartink.com/screener/gap-fade-short"

  range_breakout_short:
    strategy: range_breakout_short
