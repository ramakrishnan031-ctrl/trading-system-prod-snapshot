# ═════════════════════════════════════════════════════════════════════════════
# strategy_direction_registry.yaml — auto-maintained by
# scripts/strategy_registry_officer.py (mirrors config/cron_registry.yaml + the
# cron officer's auto-detect/notify pattern). Regime-ranking prerequisite (17-Jul-2026).
#
# ⚠️ StrategyConfig.direction (config/strategies/<name>.yaml) REMAINS the single
# source of truth for direction. This file is a REGISTRATION + HEALTH tracker that
# MIRRORS that field; it NEVER overrides it, and nothing reads direction FROM here
# to place a trade. Consumers read direction from the canonical accessor
# (core/strategy_direction.py → StrategyConfig.direction).
#
# THREE SEPARATE concepts per strategy (ChatGPT mandate — do not conflate):
#   direction            : LONG | SHORT            (authoritative; copied from StrategyConfig.direction)
#   registration_status  : PENDING | CONFIRMED     (PENDING on first detection; CONFIRMED on first filled trade)
#   health               : OK | DIRECTION_CONFLICT (a realized trade side ≠ declared direction)
#
# The daily officer OWNS writes (never a silent runtime mutation). A NEW strategy or
# a DIRECTION_CONFLICT is notified (Telegram + email); a no-change run is silent.
# The key is StrategyConfig.name (stable machine identity — display_name / entry
# conditions may change freely without changing direction; direction comes from the
# `direction` field, never the _long/_short suffix).
#
# Seeded 2026-07-17 with the current strategy set (status PENDING; the officer's first
# VM run confirms the ones that have already traded and stays otherwise silent).
# ═════════════════════════════════════════════════════════════════════════════
