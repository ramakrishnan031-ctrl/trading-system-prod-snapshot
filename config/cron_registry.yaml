# ─────────────────────────────────────────────────────────────────────────────
# Cron Job Registry — SINGLE SOURCE OF TRUTH  (TASK #3 / Cron Officer)
# ─────────────────────────────────────────────────────────────────────────────
# Read by: core/cron_registry.py -> scripts/cron_officer.py, scripts/check_cron_drift.py.
# Update THIS file when adding/removing/changing any cron job, then regenerate
# deploy/cron/trading-system.cron and re-sync the live crontab (see SYSTEM_MAP).
#
# FIX-189 (2026-06-19) — when regenerating deploy/cron/trading-system.cron, the
# generated file MUST keep two things or every Python job silently dies before
# it runs: (1) a leading `SHELL=/bin/bash` line, and (2) `. ./.env` (with the
# `./` slash) — NOT `. .env`. Reason: cron's default /bin/sh is dash, and dash's
# `.` builtin refuses to source a relative path without a slash. See the header
# of deploy/cron/trading-system.cron for the full explanation.
#
# ENV-EXPORT FIX (2026-06-19) — the source MUST be wrapped in allexport:
# `set -a && . ./.env && set +a` (NOT a plain `. ./.env`). `.env` uses bare
# `VAR=value` (no `export`), so a plain source sets shell vars that the child
# `python` does NOT inherit — every cron job ran without its .env secrets
# (reconcile_positions 15:45 broker-creds + Telegram both failed for this).
# `set -a` exports everything defined while sourcing so os.environ sees them.
# Keep this wrapper on every Python job line on any regeneration.
#
# Per-job fields:
#   script           command/path (informational; canonical cron is generated from this)
#   schedule         human-readable IST schedule
#   type             python | shell        (shell jobs cannot emit heartbeats)
#   critical         true  -> SUCCESS also alerts; FAILED always alerts
#   market_day_only  true  -> script should skip (SKIPPED heartbeat) on NSE holidays
#   cadence          daily|market_day|intraday|hourly|weekly|monthly  (drives "due today")
#   monitored        true  -> check_cron_drift / Cron Officer expect a heartbeat when due
#   weekday          0=Mon..6=Sun           (weekly cadence only)
#   day_of_month     1..28                  (monthly cadence only)

jobs:
  # ── Daily (all days) ──────────────────────────────────────────────────────
  log_cleanup:
    script: "find logs -name '*.log' -mtime +30 -delete"
    schedule: "00:00 daily"
    type: shell
    critical: false
    market_day_only: false
    cadence: daily
    monitored: false

  db_backup:
    script: "sqlite3 trading_system.db .backup backups/trading_system-<date>.db"
    schedule: "01:00 daily"
    type: shell
    critical: true
    market_day_only: false
    cadence: daily
    monitored: false

  # NOTE: present in canonical deploy/cron but MISSING from the live crontab as of
  # 2026-06-18 — analytics.db is currently un-backed-up on the VM. Pending sync.
  analytics_backup:
    script: "sqlite3 analytics.db .backup backups/analytics-<date>.db"
    schedule: "01:05 daily"
    type: shell
    critical: true
    market_day_only: false
    cadence: daily
    monitored: false

  backup_retention:
    script: "find backups (trading_system-*.db | analytics-*.db) -mtime +7 -delete"
    schedule: "02:00 daily"
    type: shell
    critical: false
    market_day_only: false
    cadence: daily
    monitored: false

  # NOTE: present in canonical deploy/cron but MISSING from the live crontab.
  # PRUNES DB ROWS (Sun run adds --vacuum) — activation is a deliberate decision.
  db_retention:
    script: "scripts/db_retention.py  (Sun: --vacuum)"
    schedule: "02:30 daily"
    type: python
    critical: false
    market_day_only: false
    cadence: daily
    monitored: false

  token_cleanup:
    script: "rm -f data_store/session/zerodha_token.json"
    schedule: "05:00 daily"
    type: shell
    critical: false
    market_day_only: false
    cadence: daily
    monitored: false

  cron_officer_briefing:
    script: "scripts/cron_officer.py --briefing"
    schedule: "09:20 daily"          # Phase 6: morning briefing post pre-flight (was 04:55)
    type: python
    critical: true
    market_day_only: false
    cadence: daily
    monitored: true

  disk_monitor:
    script: "scripts/disk_monitor.py"
    schedule: "hourly"
    type: python
    critical: false
    market_day_only: false
    cadence: hourly
    monitored: false

  # ── Market day (Mon-Fri, skip NSE holidays) ───────────────────────────────
  auto_refresh_token:
    script: "scripts/auto_refresh_token.py"
    schedule: "08:15 Mon-Fri"
    type: python
    critical: true
    market_day_only: true
    cadence: market_day
    monitored: true

  # Pre-flight check (replaces premarket_healthcheck — Phase A subsumes its 5 checks).
  # detection_method=exit_code_file: pre-flight writes a marker (no DB heartbeat); a
  # missing marker => NO_SIGNAL (informational). A missed run also surfaces loudly via
  # the Cron Officer briefing's pre-flight banner (NOT_RUN -> briefing CRITICAL).
  preflight_phase_a:
    script: "python -m scripts.preflight.orchestrator --phase A"
    schedule: "08:30 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true
    detection_method: exit_code_file

  preflight_phase_b:
    script: "python -m scripts.preflight.orchestrator --phase B"
    schedule: "09:14 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true
    detection_method: exit_code_file

  preflight_phase_c:
    script: "python -m scripts.preflight.orchestrator --phase C --watch-sec 285"
    schedule: "09:15 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true
    detection_method: exit_code_file

  fetch_fno_ban:
    script: "scripts/fetch_fno_ban.py"
    schedule: "08:35 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  gemini_premarket_brief:
    script: "scripts/gemini_premarket_brief.py"
    schedule: "08:55 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  refresh_instruments:
    script: "scripts/refresh_instruments.py --account LFL836"
    schedule: "09:00 Mon-Fri"
    type: python
    critical: true
    market_day_only: true
    cadence: market_day
    monitored: true

  capture_metrics:
    script: "scripts/capture_metrics_baseline.py"
    schedule: "*/5 09-15 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: intraday
    monitored: false

  fetch_daily_candles:
    script: "scripts/fetch_daily_candles.py"
    schedule: "15:40 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  reconcile_positions:
    script: "scripts/reconcile_positions.py --account LFL836"
    schedule: "15:45 Mon-Fri"
    type: python
    critical: true
    market_day_only: true
    cadence: market_day
    monitored: true

  eod_cleanup:
    script: "scripts/eod_cleanup.py"
    schedule: "15:50 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  eod_verify:
    script: "scripts/eod_verify.py"
    schedule: "15:55 Mon-Fri"
    type: python
    critical: true
    market_day_only: true
    cadence: market_day
    monitored: true

  daily_review:
    script: "reports/daily_review.py"
    schedule: "16:00 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  wal_checkpoint:
    script: "scripts/wal_checkpoint.py"
    schedule: "16:00 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  generate_screened_csv:
    script: "scripts/generate_screened_stocks_csv.py"
    schedule: "16:01 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  daily_report:
    script: "python -m reports.daily_report"
    schedule: "16:05 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  trade_journal:
    script: "scripts/trade_journal.py"
    schedule: "16:10 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  compute_strategy_metrics:
    script: "scripts/compute_strategy_metrics.py"
    schedule: "16:15 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  metrics_summary:
    script: "scripts/capture_metrics_baseline.py --summarize"
    schedule: "16:16 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: false   # shares the 'capture_metrics_baseline' heartbeat name

  gemini_log_review:
    script: "scripts/gemini_log_review.py"
    schedule: "16:20 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  gemini_trade_coach:
    script: "scripts/gemini_trade_coach.py"
    schedule: "16:40 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  # BUG A FIX (20-Jun): registry key renamed gemini_data_integrity ->
  # gemini_data_integrity_check to MATCH the heartbeat the script records
  # (record_heartbeat("gemini_data_integrity_check")). The old key never matched
  # a heartbeat -> the job was reported "missed" every day despite running fine.
  gemini_data_integrity_check:
    script: "scripts/gemini_data_integrity_check.py"
    schedule: "17:00 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  check_cron_drift:
    script: "scripts/check_cron_drift.py"
    schedule: "18:00 Mon-Fri"
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: false   # the monitor itself; does not self-report
    detection_method: none
    excluded_reason: "the cron drift-monitor itself — no self-signal by design"

  cron_officer_eod:
    script: "scripts/cron_officer.py --eod-summary"
    schedule: "18:50 Mon-Fri"        # Phase 6: floor 18:45 + 5min after last job (system_manager_eod 18:45)
    type: python
    critical: false
    market_day_only: true
    cadence: market_day
    monitored: true

  system_manager_eod:                       # TASK #5: deep daily cross-check
    script: "scripts/system_manager.py"
    schedule: "18:45 Mon-Fri"
    type: python
    critical: true
    market_day_only: true
    cadence: market_day
    monitored: true

  # ── Weekly ────────────────────────────────────────────────────────────────
  gemini_weekly_patterns:
    script: "scripts/gemini_weekly_patterns.py"
    schedule: "18:00 Sunday"
    type: python
    critical: false
    market_day_only: false
    cadence: weekly
    weekday: 6
    monitored: true

  # ── Monthly ─────────────────────────────────────────────────────────────────
  backup_restore_drill:
    script: "scripts/backup_restore_drill.py --quiet"
    schedule: "03:00 1st-of-month"
    type: python
    critical: false
    market_day_only: false
    cadence: monthly
    day_of_month: 1
    monitored: true

# ─────────────────────────────────────────────────────────────────────────────
# Cron Officer settings (Phase 6) — day window, alert timing, Telegram-ban route.
# Loaded by core/cron_registry.py -> OfficerConfig. All fields optional/defaulted.
# ─────────────────────────────────────────────────────────────────────────────
officer:
  day_window_start: "00:00"          # IST — counter window start / daily reset
  day_window_end: "23:59"            # IST — counter window end (covers midnight jobs)
  morning_briefing_time: "09:20"     # IST — morning briefing (post pre-flight)
  eod_floor_time: "18:45"            # IST — earliest the EOD report fires
  eod_gap_minutes: 5                 # fire +N min after the last expected job
  # Telegram ban window (IN, until 23-Jun-2026 inclusive). While active, BOTH the
  # morning briefing and EOD summary route to EMAIL (subject prefixed [LFL836-BAN]).
  # Auto-clears after the date — no manual toggle.
  telegram_ban_until: "2026-06-23"
