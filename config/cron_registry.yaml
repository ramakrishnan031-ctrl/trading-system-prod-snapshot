# Cron Job Registry — SINGLE EXECUTABLE SOURCE OF TRUTH (Phase 3).
# Read by core/cron_registry.py; generates deploy/cron/trading-system.cron
# via scripts/generate_crontab.py --generate. Edit jobs HERE, regenerate.
# Generation fields (cron_expression/command/env_wrapper/log_target/marker_name)
# are authoritative; `schedule` is documentation. enabled:false = not generated.

jobs:
  log_cleanup:
    script: find logs -name '*.log' -mtime +30 -delete
    schedule: 00:00 daily
    type: shell
    critical: false
    market_day_only: false
    cadence: daily
    monitored: false
    enabled: true
    personal_tooling: false
    cron_expression: 0 0 * * *
    command: find /home/ubuntu/systems/trading-system/logs -name '*.log' -mtime +30 -delete
    env_wrapper: none
    marker_name: log_cleanup
  db_backup:
    script: sqlite3 trading_system.db .backup backups/trading_system-<date>.db
    schedule: 01:00 daily
    type: shell
    critical: true
    market_day_only: false
    cadence: daily
    monitored: false
    enabled: true
    personal_tooling: false
    cron_expression: 0 1 * * *
    command: sqlite3 /home/ubuntu/systems/trading-system/data_store/trading_system.db ".backup /home/ubuntu/systems/trading-system/data_store/backups/trading_system-$(date +\%Y-\%m-\%d).db"
    env_wrapper: none
    log_target: '>> /home/ubuntu/systems/trading-system/logs/cron-db-backup.log 2>&1'
    marker_name: db_backup
  analytics_backup:
    script: sqlite3 analytics.db .backup backups/analytics-<date>.db
    schedule: 01:05 daily
    type: shell
    critical: true
    market_day_only: false
    cadence: daily
    monitored: false
    enabled: true
    personal_tooling: false
    cron_expression: 5 1 * * *
    command: sqlite3 /home/ubuntu/systems/trading-system/data_store/analytics.db ".backup /home/ubuntu/systems/trading-system/data_store/backups/analytics-$(date +\%Y-\%m-\%d).db"
    env_wrapper: none
    log_target: '>> /home/ubuntu/systems/trading-system/logs/cron-db-backup.log 2>&1'
    marker_name: analytics_backup
  backup_retention:
    script: scripts/backup_retention.py --apply (category-aware keep-N reaper; replaces find -mtime +7)
    schedule: 02:00 daily
    type: python
    critical: false
    market_day_only: false
    cadence: daily
    monitored: true
    enabled: true
    personal_tooling: false
    cron_expression: 0 2 * * *
    command: scripts/backup_retention.py --apply
    env_wrapper: python
    log_target: '>> logs/cron-backup-retention.log 2>&1'
    marker_name: backup_retention
  sentinel_retention:
    script: find data_store critical_alert_*.delivered -mtime +7 -delete (never *.flag)
    schedule: 02:05 daily
    type: shell
    critical: false
    market_day_only: false
    cadence: daily
    monitored: false
    enabled: true
    personal_tooling: false
    cron_expression: 5 2 * * *
    command: find /home/ubuntu/systems/trading-system/data_store -maxdepth 1 -name "critical_alert_*.delivered" -mtime +7 -delete
    env_wrapper: none
    log_target: '>> /home/ubuntu/systems/trading-system/logs/cron-sentinel-retention.log 2>&1'
    marker_name: sentinel_retention
  db_retention:
    script: 'scripts/db_retention.py  (Sun: --vacuum)'
    schedule: 02:30 daily
    type: python
    critical: false
    market_day_only: false
    cadence: daily
    monitored: false
    enabled: true
    personal_tooling: false
