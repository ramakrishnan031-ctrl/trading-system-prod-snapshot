# config/strategies/gap_go_short.yaml
# Locked decisions: S1-S15
# S13: gap_go = pullback_wait_enabled: false (momentum entry)

name: "gap_go_short"
display_name: "Gap Go Short"
description: "Short momentum entry on downward gap continuation at market open"

direction: "SHORT"
intent: "INTRADAY"
order_protocol: "CO_PLUS_TGT"

entry_method: "LIMIT"
entry_offset_pct: 0.001

sl_method: "FIXED_PCT"
sl_pct: 0.012
sl_atr_multiplier: 1.5
sl_min_pct: 0.003
sl_max_pct: 0.05

tgt_method: "RISK_REWARD"
tgt_pct: 0.0
tgt_risk_reward: 2.5
tgt_atr_multiplier: 2.5

smart_tgt_enabled: true
smart_tgt_trail_trigger_pct: 0.005
smart_tgt_trail_step_pct: 0.003

pullback_wait_enabled: false
pullback_wait_tolerance_pct: 0.005
pullback_wait_timeout_sec: 180

min_score: 0
min_volume_surge: 2.0
min_adr_pct: 0.005
max_spread_pct: 0.005

max_risk_pct: 0.0
lot_size: 1

entry_start_time: "09:30"
entry_end_time: "11:00"
active_days:
  - MON
  - TUE
  - WED
  - THU
  - FRI
