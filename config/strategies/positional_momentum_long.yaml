# config/strategies/positional_momentum_long.yaml
# Locked decisions: S1-S15
# S6: DELIVERY intent, LIMIT_TRIPLE protocol, ATR-based SL/TGT, no smart_tgt

name: "positional_momentum_long"
display_name: "Positional Momentum Long"
description: "Multi-day long position on strong momentum stocks with ATR-based risk management"

direction: "LONG"
intent: "DELIVERY"
enabled: true
order_protocol: "LIMIT_TRIPLE"

# Taxonomy (metadata + display only; V3 side-task A). SWING = multi-day hold.
pipeline: "DELIVERY"
horizon: "SWING"

entry_method: "LIMIT"
entry_offset_pct: 0.002

sl_method: "FIXED_PCT"    # ATR not yet implemented; using FIXED_PCT until ATR data available
sl_pct: 0.02
sl_atr_multiplier: 2.0
sl_min_pct: 0.005
sl_max_pct: 0.08

tgt_method: "RISK_REWARD"
tgt_pct: 0.0
tgt_risk_reward: 1.5
tgt_atr_multiplier: 3.0

smart_tgt_enabled: false
smart_tgt_trail_trigger_pct: 0.005
smart_tgt_trail_step_pct: 0.003

pullback_wait_enabled: false
pullback_wait_tolerance_pct: 0.005
pullback_wait_timeout_sec: 180

min_score: 0
min_volume_surge: 1.5
min_adr_pct: 0.005
max_spread_pct: 0.005

lot_size: 1
max_concurrent_positions: 2  # FIX-135 Item 42

entry_start_time: "09:25"
entry_end_time: "15:00"   # FIX-134: uniform window until paper testing complete
active_days:
  - MON
  - TUE
  - WED
  - THU
  - FRI
