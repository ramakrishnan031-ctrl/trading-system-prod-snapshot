# config/strategies/positional_sector_rotation.yaml
# Locked decisions: S1-S15
# S6: DELIVERY intent, LIMIT_TRIPLE protocol, ATR-based SL/TGT, no smart_tgt

name: "positional_sector_rotation"
display_name: "Positional Sector Rotation"
description: "Multi-day long position on outperforming sector leaders during sector rotations"

direction: "LONG"
intent: "DELIVERY"
order_protocol: "LIMIT_TRIPLE"

entry_method: "LIMIT"
entry_offset_pct: 0.002

sl_method: "FIXED_PCT"    # ATR not yet implemented; using FIXED_PCT until ATR data available
sl_pct: 0.02
sl_atr_multiplier: 2.0
sl_min_pct: 0.005
sl_max_pct: 0.08

tgt_method: "RISK_REWARD"
tgt_pct: 0.0
tgt_risk_reward: 2.0
tgt_atr_multiplier: 3.0

smart_tgt_enabled: false
smart_tgt_trail_trigger_pct: 0.005
smart_tgt_trail_step_pct: 0.003

pullback_wait_enabled: false
pullback_wait_tolerance_pct: 0.005
pullback_wait_timeout_sec: 180

min_score: 0
min_volume_surge: 1.3
min_adr_pct: 0.005
max_spread_pct: 0.005

max_risk_pct: 0.01  # FIX-031: 1% risk per trade (was 0.0 which produces qty=0)
lot_size: 1

entry_start_time: "09:20"
entry_end_time: "15:20"  # TEMP PAPER: was 14:30 — REVERT BEFORE LIVE
active_days:
  - MON
  - TUE
  - WED
  - THU
  - FRI
