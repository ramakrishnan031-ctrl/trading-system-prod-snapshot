# config/strategies/gap_fade_long.yaml
# Locked decisions: S1-S15
# S13: gap_fade = pullback_wait_enabled: false (timing-sensitive fade entry)

name: "gap_fade_long"
display_name: "Gap Fade Long"
description: "Long entry fading an opening gap-down as price reverses toward prior close"

direction: "LONG"
intent: "INTRADAY"
order_protocol: "CO_PLUS_TGT"

entry_method: "LIMIT"
entry_offset_pct: 0.001

sl_method: "FIXED_PCT"
sl_pct: 0.01
sl_atr_multiplier: 1.5
sl_min_pct: 0.003
sl_max_pct: 0.05
sl_gap_buffer_pct: 0.3  # FIX-130: widen SL 0.3% during 09:15-09:30 gap-risk window

tgt_method: "RISK_REWARD"
tgt_pct: 0.0
tgt_risk_reward: 1.5
tgt_atr_multiplier: 2.5

smart_tgt_enabled: true
smart_tgt_trail_trigger_pct: 0.005
smart_tgt_trail_step_pct: 0.003

pullback_wait_enabled: false
pullback_wait_tolerance_pct: 0.005
pullback_wait_timeout_sec: 180

min_score: 30  # TEMP: lowered for paper testing (was 0 -> uses scorer default)
min_volume_surge: 1.3
min_adr_pct: 0.005
max_spread_pct: 0.005

max_risk_pct: 0.01  # FIX-031: 1% risk per trade (was 0.0 which produces qty=0)
lot_size: 1

entry_start_time: "09:20"
entry_end_time: "15:20"  # TEMP PAPER: was 11:30 — REVERT BEFORE LIVE
active_days:
  - MON
  - TUE
  - WED
  - THU
  - FRI
