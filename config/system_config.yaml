# config/system_config.yaml — Trading System v2
#
# Master configuration. Every numeric and boolean limit here has a
# corresponding runtime check, Telegram alert, and daily report row (P2).
# All time values are "HH:MM" strings interpreted as IST (P1).
#
# Locked decisions: P1, P2, P4, P8, P11b, P13, P14, P15, Q1, G4, PR8
# product_map embedded here per CL6 note (no separate broker_product_map.yaml).

trading_hours:
  entry_start: "09:20"        # Paper Week 2 (2026-04-27): widened from P1 spec 09:30 to capture earlier signals
  entry_end: "15:15"          # Paper Week 2 (2026-04-27): widened from P1 spec 13:30 (still <= eod_squareoff_time 15:17)
  eod_squareoff_time: "15:17" # Square-off trigger; 3-min buffer before RMS auto-sq at 15:20 (P1)
  market_open: "09:15"        # NSE regular-session open
  market_close: "15:30"       # NSE regular-session close; cutoff for EOD-window checks

signal_queue:
  capacity: 300               # Max signals in queue before HTTP 503 (P15)
  backpressure_pct: 0.80      # 503 threshold = capacity * backpressure_pct (P15)
  expiry_sec: 300             # WR6: reject signal older than this (5 min for paper mode latency)

product_map:                  # PR8: broker -> {INTENT -> broker_code}
  zerodha:
    INTRADAY: "MIS"           # Margin Intraday Squareoff (PR3)
    DELIVERY: "CNC"           # Cash-and-Carry -- delivery / positional (PR3)
    COVER_ORDER: "CO"         # Cover Order -- bracket with built-in SL (PR3)
    BRACKET_ORDER: ""         # Zerodha discontinued BO; empty = not supported (PR3)

clock:
  warn_skew_sec: 2.0          # G4 tier 1: log warning
  alert_skew_sec: 5.0         # G4 tier 2: Telegram alert, continue trading
  halt_skew_sec: 30.0         # G4 tier 3: fire on_critical_skew -> soft_kill
  startup_max_skew_sec: 30.0  # G4: refuse to start if startup skew exceeds this
  probe:                      # BL-21: periodic driver for record_broker_skew
    enabled: true
    probe_interval_sec: 60    # how often to call adapter.get_server_time()

order_monitor:                # OM14
  poll_interval_sec: 2        # poll broker every 2s for fill updates (>= 1)
  fill_timeout_sec: 60        # cancel unfilled OPEN/SUBMITTED order after 60s (>= 5)

capital:                      # FM16
  intraday_bucket_pct: 0.70   # 70% of total capital for intraday (MIS/CO)
  positional_bucket_pct: 0.30 # 30% of total capital for positional (CNC)
  daily_loss_limit: 10000.0   # absolute rupee daily loss limit (> 0)
  leverage_map:
    INTRADAY: 5.0             # MIS leverage
    COVER_ORDER: 6.0          # CO leverage
    DELIVERY: 1.0             # CNC, no leverage
    BRACKET_ORDER: 5.0        # BO leverage

position_sizing:              # PS9
  risk_per_trade_pct: 0.01    # 1% of total capital at risk per trade (PS2)
  max_concentration_pct: 0.10 # max 10% of total capital in one symbol (PS2)
  min_qty_threshold: 1        # reject signal if final qty below this (PS6)
  tier_multipliers:           # PS5: applied after min(risk, capital, conc)
    HIGH: 1.0                 # full size
    MEDIUM: 0.70              # 70% of computed size
    LOW: 0.50                 # 50% of computed size (audit Bug 5 fix)

risk:                         # RE13 — portfolio-level pre-trade gate limits
  max_open_positions: 10      # hard cap on concurrent open positions (>= 1)
  max_daily_trades: 20        # hard cap on trades per day (>= 1)
  max_sector_exposure_pct: 0.40  # max 40% of total capital in one sector (> 0, <= 1)
  max_consecutive_losses: 4   # halt after 4 consecutive net losses (>= 1)
  daily_loss_limit_pct: 0.05  # 5% of total capital daily loss limit (> 0, <= 1)

webhook:                      # WR14 — HTTP server settings
  bind_host: "0.0.0.0"        # 2026-04-27: bind all interfaces so the VM
                              # can accept Chartink webhooks routed via
                              # ngrok/external. Loopback-only (127.0.0.1)
                              # is the safer default; the all-interfaces
                              # bind here relies on require_hmac=true plus
                              # firewall/security-group restrictions to
                              # constrain the actual reachable surface.
  bind_port: 5000             # port to listen on
  require_hmac: false         # TEMP: disabled for Chartink (no HMAC support)

signal_processor:             # SP15 — worker pool settings
  worker_count: 5             # ThreadPoolExecutor workers (1-50)
  drain_poll_sec: 0.1         # queue poll interval when empty
  pipeline_timeout_sec: 30    # hard per-signal processing deadline
  tgt_min_pct: 0.003          # BL-16: reject signal if target distance < 0.3% of entry

kill_switch:                  # KS7 — auto-trip settings
  api_failure_threshold: 3    # consecutive API failures before auto soft_kill (>= 1)
  enable_auto_trip: true      # if false, record_api_failure never triggers soft_kill

eod_squareoff:                # EOD12 — EOD square-off settings
  inter_order_delay_ms: 500   # ms delay between successive MARKET exit orders (>= 0, <= 5000)
  poll_interval_sec: 5        # scheduler poll cadence; passed to start_polling() (>= 1)
  auto_resume_kill_switch: true  # if true, resume SOFT_KILL after EOD fire completes
  exit_protocol: "LIMIT_THEN_MARKET"  # Audit 3.3 — aggressive LIMIT, MARKET fallback
  limit_aggressive_pct: 0.01  # LTP ± 1% for the initial exit limit
  limit_grace_sec: 120        # seconds to wait before promoting unfilled LIMITs to MARKET

alerts:                       # TG12/AW11 — alert subsystem settings
  failed_alerts_log_path: "logs/failed_alerts.log"
  sentinel_dir: "data_store"
  watcher_max_attempts: 5
  watcher_lock_path: "data_store/alert_watcher.lock"
  watcher_log_path: "logs/alert_watcher.log"
  telegram:
    bot_token_env: "TELEGRAM_BOT_TOKEN"
    telegram_alerts_in_paper_mode: true
    channels:
      - chat_id_env: "TELEGRAM_CHANNEL_PRIMARY"
        label: "Primary Alert Channel"
        enabled: true
      - chat_id_env: "TELEGRAM_CHANNEL_SECONDARY"
        label: "Secondary Alert Channel"
        enabled: false
    personal_chat_id_env: "TELEGRAM_PERSONAL_CHAT_ID"
    whitelist_only: true
  smtp:
    host: "smtp.gmail.com"
    port: 587
    use_tls: true
    username: "alerts@example.com"
    # G.3 (2026-04-25): password is read from the env var named here at
    # alert_watcher boot. Plaintext `password:` field is no longer set in
    # this committed config; if you need it for local-only testing, override
    # it in a non-committed config_overrides file. Production: set
    # ALERT_SMTP_PASSWORD on the alert_watcher host (systemd EnvironmentFile
    # or the user shell rc).
    password_env: "ALERT_SMTP_PASSWORD"
    from_address: "alerts@example.com"
    to_addresses:
      - "operator@example.com"
    timeout_sec: 30

order_reconciler:             # RC17 — reconciler tuning
  poll_interval_sec: 15       # P14: 15-second periodic cadence
  capital_drift_tolerance: 50.0  # G3 Level 3: alert if broker/local delta > Rs50

shadow_tracker:               # SH11 — multi-inning tracking (Concern 4)
  enabled: true               # SH13: false = all handlers no-ops; table stays empty
  max_innings: 3              # SH4: total innings (1 real + up to 2 simulated)
  alert_per_inning: true      # SH7: send Telegram INFO on each inning close

smart_tgt:                    # BL-7b: SmartTgtManager deployment-wide defaults
  enabled: true               # master switch; if false, OrderPlacer skips SmartTgt wiring
  trigger_pct: 0.005          # arm trailing once price moves this fraction toward target (0.5%)
  step_pct: 0.003             # trail step size once armed (0.3%)

paper:                        # H-20/ZA16a: paper-mode fill synthesis
  auto_fill_delay_sec: 0.5    # daemon thread delay before OSM COMPLETE + OrderFilled (>= 0, <= 10)
  ltp_gating_enabled: true    # Audit 6.2 — only fill paper LIMIT/SL when LTP crosses
  ltp_gating_max_wait_sec: 60 # bounded LTP-poll horizon for LIMIT/SL synth (<= 3600)
  ltp_gating_poll_sec: 0.5    # poll cadence for the LTP-gating loop (> 0, <= 30)

drift_handler:                # BL-2: capital drift escalation
  # Absolute rupee thresholds, scaled for paper trial (~Rs50k).
  # Revisit for live-scale capital; consider percentage-based
  # thresholds if account size grows significantly.
  log_only_threshold_rs: 250.0
  soft_kill_threshold_rs: 1000.0
  hard_kill_threshold_rs: 2500.0
  consecutive_cycles_before_escalate: 3
